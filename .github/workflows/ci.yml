name: CI & Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NX_DAEMON: false
      NX_ISOLATE_PLUGINS: false
      ALLOW_SOCKET_TESTS: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:all -- --verbose

      - name: Test
        run: npm run test:all -- --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: |
            **/coverage/lcov.info
          fail_ci_if_error: true

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: lint-test
    env:
      NX_DAEMON: false
      NX_ISOLATE_PLUGINS: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (libs and API)
        run: |
          npx nx run-many -t build --projects=@nba-analytics-hub/types,@nba-analytics-hub/domain,@nba-analytics-hub/config,@nba-analytics-hub/data-access,@nba-analytics-hub/testing,@nba-analytics-hub/ui,@nba-analytics-hub/api --parallel=2
